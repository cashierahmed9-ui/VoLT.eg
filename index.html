<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOLT — New Collection</title>
<meta name="description" content="VOLT. Everyday essentials. Different attitude.">

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0b0c;
  --bg2:#141416;
  --card:#18181b;
  --line:#26262a;
  --text:#f5f5f5;
  --muted:#9a9aa2;
  --blue:#168bff;
  --violet:#9b45ff;
  --ann-h:38px;
  --header-bg: rgba(11,11,12,.88);
  --header-btn-hover: rgba(255,255,255,.1);
}

/* Light Mode Variables */
body.light-mode {
  --bg:#f8f9fa;
  --bg2:#ffffff;
  --card:#ffffff;
  --line:#e4e4e8;
  --text:#111111;
  --muted:#6c757d;
  --header-bg: rgba(255,255,255,.88);
  --header-btn-hover: rgba(0,0,0,.06);
}

html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .3s, color .3s}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
img{display:block;max-width:100%}
body.lock{overflow:hidden}

/* ANNOUNCEMENT */
.announcement{height:var(--ann-h);background:#000;color:#fff;overflow:hidden;white-space:nowrap;display:flex;align-items:center;font-size:11px;font-weight:700;letter-spacing:2.5px;border-bottom:1px solid var(--line)}
.ann-track{display:flex;width:max-content;animation:scroll 22s linear infinite}
.ann-group{display:flex;flex-shrink:0}
.ann-group span{padding:0 34px}
.ann-group span::after{content:"•";margin-left:68px;color:var(--violet)}
@keyframes scroll{to{transform:translateX(-50%)}}

/* HEADER */
.site-header{
  position:fixed;left:0;right:0;top:var(--ann-h);z-index:50;
  display:flex;justify-content:space-between;align-items:center;
  padding:22px 4%;
  transition:top .35s,background .35s,padding .35s,border-color .35s;
  border-bottom:1px solid transparent;
}
.site-header.scrolled{top:0;background:var(--header-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:14px 4%;border-color:var(--line)}
.nav{display:flex;gap:30px;font-size:12px;font-weight:700;letter-spacing:1.5px}
.nav a{position:relative;padding:4px 0}
.nav a::after{content:"";position:absolute;left:0;bottom:0;height:1px;width:0;background:var(--text);transition:width .3s}
.nav a:hover::after{width:100%}
.logo{
  font-size:34px;font-weight:900;letter-spacing:8px;margin-right:-8px;
  background:linear-gradient(90deg,#168bff,#111,#9b45ff,#168bff);background-size:300% auto;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:logoColors 5s linear infinite;filter:drop-shadow(0 0 10px rgba(68,138,255,.45));
}
body:not(.light-mode) .logo {
  background:linear-gradient(90deg,#168bff,#fff,#9b45ff,#168bff);
  background-size:300% auto;
  -webkit-background-clip:text;
}
@keyframes logoColors{to{background-position:300% center}}

/* HERO LOGO */
.hero-logo{
  position:absolute;left:4%;top:120px;z-index:2;
  font-size:clamp(56px,9vw,120px);font-weight:900;letter-spacing:.08em;line-height:1;
  background:linear-gradient(90deg,#fff 0%,#fff 38%,#000 50%,#fff 62%,#fff 100%);
  background-size:200% auto;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:heroLogo 4s linear infinite;
  filter:drop-shadow(0 0 1px rgba(255,255,255,.55)) drop-shadow(0 4px 18px rgba(0,0,0,.5));
}
@keyframes heroLogo{to{background-position:200% center}}

.actions{display:flex;justify-content:flex-end;align-items:center;gap:6px}
.icon-btn{background:none;border:0;color:var(--text);width:42px;height:42px;display:grid;place-items:center;position:relative;border-radius:50%;transition:background .2s}
.icon-btn:hover{background:var(--header-btn-hover)}
.icon-btn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cart-count{position:absolute;top:2px;right:0;min-width:18px;height:18px;border-radius:9px;background:var(--violet);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px;transform:scale(0);transition:transform .25s}
.cart-count.show{transform:scale(1)}
.burger{display:none}

/* Theme Toggle Icons */
.theme-icon-sun { display: none; }
.theme-icon-moon { display: block; }
body.light-mode .theme-icon-sun { display: block; }
body.light-mode .theme-icon-moon { display: none; }

/* HERO */
.hero{
  position:relative;height:calc(100vh - var(--ann-h));min-height:640px;
  display:flex;align-items:flex-end;
  color: #fff;
  background:
    linear-gradient(90deg,rgba(0,0,0,.78) 0%,rgba(0,0,0,.6) 30%,rgba(0,0,0,.25) 50%,rgba(0,0,0,0) 68%),
    linear-gradient(0deg,rgba(11,11,12,.9) 0%,rgba(11,11,12,0) 38%),
    url("https://cdn.phototourl.com/member/2026-10-30-101b87cf-f356-4c88-930e-170221bfa06c.jpg") center top/cover no-repeat;
}
.hero-content{padding:0 4% 90px;max-width:720px;animation:rise 1s ease both}
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:12px;font-weight:700;letter-spacing:4px;color:#d8d8dc}
.eyebrow i{width:8px;height:8px;border-radius:50%;background:#ff3b3b;box-shadow:0 0 0 0 rgba(255,59,59,.7);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 10px rgba(255,59,59,0)}100%{box-shadow:0 0 0 0 rgba(255,59,59,0)}}
.hero h1{font-size:clamp(46px,8vw,104px);font-weight:900;line-height:.98;margin:18px 0 14px;letter-spacing:-1px}
.hero p.sub{font-size:13px;letter-spacing:4px;color:#cfcfd4;margin-bottom:30px}
.btn{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#111;border:1px solid #fff;padding:16px 36px;font-size:12px;font-weight:800;letter-spacing:2px;transition:.3s}
.btn:hover{background:transparent;color:#fff}
.btn.ghost{background:transparent;color:#fff;margin-left:10px}
.btn.ghost:hover{background:#fff;color:#111}
.rating{display:flex;align-items:center;gap:10px;margin-top:34px;font-size:12px;color:#d0d0d5}
.stars{color:#fff;letter-spacing:3px}
.scroll-hint{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);width:34px;height:34px;display:grid;place-items:center;animation:bounce 2s infinite}
.scroll-hint svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2}
@keyframes bounce{50%{transform:translate(-50%,8px)}}

/* FEATURES */
.features{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line);background:var(--bg2)}
.feature{padding:30px 4%;display:flex;gap:16px;align-items:center;border-right:1px solid var(--line)}
.feature:last-child{border:0}
.feature svg{width:28px;height:28px;stroke:var(--violet);fill:none;stroke-width:1.6;flex-shrink:0}
.feature b{display:block;font-size:12px;letter-spacing:2px;margin-bottom:4px}
.feature span{font-size:12px;color:var(--muted)}

/* ================= SHOP ================= */
#shop{background:var(--bg2);color:var(--text);padding-bottom:30px;transition:background .3s}
.section-head{text-align:center;padding:90px 4% 34px}
.section-head small{font-size:11px;letter-spacing:5px;color:var(--violet);font-weight:700}
.section-head h2{font-size:clamp(28px,4vw,44px);letter-spacing:2px;margin-top:12px;color:var(--text)}
.toolbar{max-width:1400px;margin:0 auto;padding:0 4% 44px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{background:transparent;color:var(--text);border:1px solid var(--line);padding:11px 20px;font-size:11px;font-weight:700;letter-spacing:1.5px;transition:.25s}
.filters button:hover{border-color:var(--text)}
.filters button.active{background:var(--text);color:var(--bg);border-color:var(--text)}
.search{position:relative}
.search input{background:var(--bg);border:1px solid var(--line);color:var(--text);padding:12px 16px 12px 42px;width:270px;max-width:100%;font-size:13px;outline:none;transition:border-color .2s}
.search input:focus{border-color:var(--violet)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2}

.grid{max-width:1400px;margin:0 auto;padding:0 4% 70px;display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:56px 34px}
.product{min-width:0;--c:#141414;--ink:#fff;text-align:center}

.stage{position:relative;aspect-ratio:1/1.08}
.shape{
  position:absolute;left:50%;top:52%;--rot:0deg;
  transform:translate(-50%,-50%) rotate(var(--rot));
  background:#e8e8ed;
  background:color-mix(in srgb,var(--c) 14%,#e6e6ec);
  transition:transform .7s cubic-bezier(.2,.7,.2,1),border-radius .7s,background .4s;
}
.s0{width:66%;height:84%;border-radius:999px 999px 14px 14px}
.s1{width:76%;aspect-ratio:1;border-radius:50%}
.s2{width:66%;aspect-ratio:1;border-radius:26px;--rot:-9deg}
.s3{width:78%;aspect-ratio:1;border-radius:62% 38% 54% 46%/48% 58% 42% 52%;--rot:12deg}
.s4{width:52%;height:86%;border-radius:999px;--rot:8deg}
.s5{width:54%;aspect-ratio:1;border-radius:22px;--rot:45deg}
.product:hover .shape{transform:translate(-50%,-50%) rotate(calc(var(--rot) + 10deg)) scale(1.06)}
.product:hover .s3{border-radius:40% 60% 46% 54%/58% 42% 58% 42%}

.prod{
  position:absolute;left:50%;bottom:3%;width:92%;transform:translateX(-50%);
  filter:drop-shadow(0 16px 12px rgba(0,0,0,.2));
  transition:transform .55s cubic-bezier(.2,.7,.2,1);
}
.prod svg{display:block;width:100%;height:auto;overflow:visible}
.prod.photo{height:96%;bottom:2%;filter:none}
.prod.photo.blend{mix-blend-mode:multiply}
.prod.photo.cut{filter:drop-shadow(0 16px 12px rgba(0,0,0,.2))}
.prod.photo img{width:100%;height:100%;object-fit:contain;display:block}
.thumb img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.product:hover .prod{transform:translate(-50%,-10px) rotate(-2.5deg) scale(1.04)}
.tag{position:absolute;top:2%;left:2%;z-index:2;background:var(--text);color:var(--bg);padding:5px 9px;font-size:9px;font-weight:800;letter-spacing:1.5px}

.info{padding-top:8px}
.info h3{font-size:11.5px;font-weight:800;letter-spacing:1.5px;margin-bottom:5px;color:var(--text)}
.price{font-size:12.5px;color:var(--muted);margin-bottom:12px;display:block}
.swatches{display:flex;gap:9px;justify-content:center;align-items:center;margin-bottom:11px;min-height:22px}
.swatches button{width:18px;height:18px;border-radius:50%;border:1px solid rgba(0,0,0,.22);padding:0;transition:transform .2s,box-shadow .2s}
.swatches button:hover{transform:scale(1.15)}
.swatches button.sel{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--text)}
.cname{font-style:normal;font-size:10px;font-weight:700;letter-spacing:1.5px;color:var(--muted);margin-left:4px;min-width:42px;text-align:left}
.sizes{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-bottom:13px}
.sizes button{min-width:30px;height:26px;padding:0 8px;background:transparent;color:var(--muted);border:1px solid var(--line);font-size:10.5px;font-weight:700;transition:.2s}
.sizes button:hover{color:var(--text);border-color:var(--text)}
.sizes button.sel{background:var(--text);color:var(--bg);border-color:var(--text)}
.add{width:100%;height:34px;background:transparent;color:var(--text);border:1px solid var(--text);font-size:10.5px;font-weight:800;letter-spacing:2px;transition:.25s}
.add:hover{background:var(--text);color:var(--bg)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 0}

/* BANNER STRIP */
.cta{margin:90px 4%;padding:70px 6%;border:1px solid var(--line);background:
  radial-gradient(600px 240px at 85% 0%,rgba(155,69,255,.28),transparent 70%),
  radial-gradient(500px 240px at 0% 100%,rgba(22,139,255,.22),transparent 70%),var(--bg2);
  display:flex;justify-content:space-between;align-items:center;gap:30px;flex-wrap:wrap}
.cta h3{font-size:clamp(26px,4vw,46px);font-weight:900;line-height:1.05;color:var(--text)}
.cta p{color:var(--muted);margin-top:10px;font-size:14px;letter-spacing:1px}

/* FOOTER */
footer{border-top:1px solid var(--line);padding:60px 4% 30px;text-align:center;background:var(--bg)}
footer .logo{display:inline-block;font-size:40px}
footer p{color:var(--muted);font-size:12px;letter-spacing:2px;margin-top:14px}
.links{display:flex;gap:26px;justify-content:center;flex-wrap:wrap;margin:26px 0;font-size:12px;font-weight:700;letter-spacing:1.5px;color:var(--text)}
.links a:hover{color:var(--violet)}
.copy{border-top:1px solid var(--line);margin-top:30px;padding-top:24px;font-size:11px!important}

/* CART DRAWER */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .3s;z-index:90}
.overlay.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(420px,100%);background:var(--bg2);border-left:1px solid var(--line);z-index:100;transform:translateX(100%);transition:transform .4s cubic-bezier(.2,.7,.2,1);display:flex;flex-direction:column;color:var(--text)}
.drawer.open{transform:none}
.drawer-head{display:flex;justify-content:space-between;align-items:center;padding:22px 24px;border-bottom:1px solid var(--line);font-size:13px;font-weight:800;letter-spacing:3px}
.drawer-body{flex:1;overflow:auto;padding:10px 24px}
.line-item{display:grid;grid-template-columns:76px 1fr auto;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.thumb{width:76px;height:96px;background:#ececf0;display:grid;place-items:center;overflow:hidden}
.thumb svg{width:100%;height:auto}
